program: train.py
method: bayes
name: "poyo_plus_bayes_sweep"
entity: ...    # Add this line
project: poyo        # Add this line

metric:
  name: average_val_metric
  goal: maximize

command:
  - python
  - ${program}
  - --config-name=train_capoyo.yaml
  - ${args_no_hyphens}

parameters:
  "optim.base_lr":
    distribution: log_uniform_values
    min: 5e-6
    max: 5e-3
    
  "optim.weight_decay":
    distribution: log_uniform_values
    min: 1e-7
    max: 1e-3

  "optim.lr_decay_start":
    distribution: uniform
    min: 0.1
    max: 0.7
    
  batch_size:
    values: [64, 128, 256]

  "model.latent_step":
    values: [0.0625, 0.125, 0.25]
    
  "model.num_latents_per_step":
    values: [8, 16, 32]
    
  "model.depth":
    values: [4, 6, 12, 18, 24]
    
  "model.dim":
    values: [32, 64, 128]
    
  "model.dim_head":
    values: [32, 64, 128]
    
  "model.cross_heads":
    values: [2, 4, 6, 8]
    
  "model.self_heads":
    values: [2, 4, 6, 8]
    
  "model.ffn_dropout":
    distribution: log_uniform_values
    min: 0.01
    max: 0.6
    
  "model.atn_dropout":
    distribution: log_uniform_values
    min: 0.01
    max: 0.6
    
  "model.lin_dropout":
    distribution: log_uniform_values
    min: 0.01
    max: 0.6

early_terminate:
  type: hyperband
  min_iter: 7
